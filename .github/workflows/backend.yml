name: Backend checks
on:
  push:
    paths: ['src/**', 'tests/**', 'eval/**', 'scripts/**', 'bids/**', 'pyproject.toml', 'requirements.lock', '.github/workflows/backend.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'eval/**', 'scripts/**', 'bids/**', 'pyproject.toml', 'requirements.lock', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RFP_MODEL_CACHE_DIR: ./models
      RFP_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: models
          key: rfp-onnx-bge-tinybert-v1
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.lock && pip install '.[dev]'
      - run: ruff check src tests scripts eval
      - run: ruff format --check src tests scripts eval
      - run: python -I -m rfp --help
      - run: python -m unittest discover -s tests -v
      - run: rfp index Bid1 && rfp index Bid2
      - run: python eval/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/retrieval-evaluation.json
