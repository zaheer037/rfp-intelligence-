[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-intelligence"
version = "0.1.0"
description = "Cited hybrid search and Google ADK agents for RFP documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "google-adk[a2a]>=1.25,<3",
  "litellm>=1.80,<2", "faiss-cpu>=1.10,<2", "numpy>=2,<3",
  "rank-bm25>=0.2.2,<1", "beautifulsoup4>=4.13,<5",
  "pymupdf>=1.25,<2", "pdfplumber>=0.11,<1", "pillow>=11,<13",
  "prometheus-client>=0.21,<1", "httpx>=0.28,<1",
  "fastembed>=0.7,<1", "flashrank>=0.2,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
rfp = "rfp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rfp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
